# Infoniqadashboard – Azure Pipeline
# Mirrors the deployment schema of brz365-internals-teamdashboard:
#   1. Build & push Docker image to ACR
#   2. Delete existing Container Instance (if any)
#   3. Create new Container Instance with env vars / secrets
#   4. Update private DNS record

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - .azure/*
      - docs/*
      - Mockup/*
      - README.md

stages:
  - stage: Build
    pool:
      name: azdo-apool-private-mdp-default-production
      demands:
        - ImageOverride -equals ubuntu-latest
    jobs:
      - job: BuildAndDeploy
        displayName: Build & Deploy Infoniqadashboard
        variables:
          - group: vg-teamsdashboard   # must contain: ACR_USERNAME, ACR_PASSWORD, JIRA_API_TOKEN, JIRA_EMAIL
        steps:
          - checkout: self
            fetchDepth: 0

          # ── 1. Build & push image ─────────────────────────────────────────
          - task: AzureCLI@2
            displayName: 'Build and Push Docker Image'
            inputs:
              azureSubscription: azurerm-appzone-brz365-prod-internaltools-001-spn-az-internaltoolsproduction-internaltools-production-prod
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Building and pushing Docker image..."
                az acr build \
                  --subscription brz365-prod-internaltools-001 \
                  --registry crinternalproduction \
                  --image infoniqadashboard:latest \
                  --platform linux \
                  --file Dockerfile \
                  .

          # ── 2. Delete existing container ─────────────────────────────────
          - task: AzureCLI@2
            displayName: 'Remove Existing Container'
            continueOnError: true
            inputs:
              azureSubscription: azurerm-appzone-brz365-prod-internaltools-001-spn-az-internaltoolsproduction-internaltools-production-prod
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                CONTAINER_EXISTS=$(az container show \
                  --resource-group rg-internal-production \
                  --name infoniqadashboard \
                  --query name -o tsv 2>/dev/null || echo "")

                if [ -n "$CONTAINER_EXISTS" ]; then
                  echo "Stopping and deleting existing container..."
                  az container stop \
                    --resource-group rg-internal-production \
                    --name infoniqadashboard

                  az container delete \
                    --resource-group rg-internal-production \
                    --name infoniqadashboard \
                    --yes

                  echo "Waiting for container deletion..."
                  sleep 10
                else
                  echo "No existing container found."
                fi

          # ── 3. Create Container Instance ─────────────────────────────────
          - task: AzureCLI@2
            displayName: 'Deploy to Container Instance'
            inputs:
              azureSubscription: azurerm-appzone-brz365-prod-internaltools-001-spn-az-internaltoolsproduction-internaltools-production-prod
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Creating Container Instance..."
                az container create \
                  --resource-group rg-internal-production \
                  --name infoniqadashboard \
                  --image crinternalproduction.azurecr.io/infoniqadashboard:latest \
                  --registry-login-server crinternalproduction.azurecr.io \
                  --registry-username $(ACR_USERNAME) \
                  --registry-password $(ACR_PASSWORD) \
                  --cpu 1 \
                  --memory 1 \
                  --ports 3000 \
                  --ip-address Private \
                  --vnet /subscriptions/97c8f175-a015-4654-9483-37f7650005a5/resourceGroups/rg-connectivity/providers/Microsoft.Network/virtualNetworks/vnet-brz365-prod-internaltools-001-10.226.160.0_19 \
                  --subnet /subscriptions/97c8f175-a015-4654-9483-37f7650005a5/resourceGroups/rg-connectivity/providers/Microsoft.Network/virtualNetworks/vnet-brz365-prod-internaltools-001-10.226.160.0_19/subnets/snet-internal-common-production \
                  --environment-variables \
                    NODE_ENV=production \
                    PORT=3000 \
                    HOSTNAME=0.0.0.0 \
                    JIRA_EMAIL=$(JIRA_EMAIL) \
                  --secure-environment-variables \
                    JIRA_API_TOKEN=$(JIRA_API_TOKEN) \
                  --restart-policy Always \
                  --os-type Linux

          # ── 4. Update private DNS record ─────────────────────────────────
          - task: AzureCLI@2
            displayName: 'Update DNS Record'
            inputs:
              azureSubscription: azurerm-appzone-brz365-prod-internaltools-001-spn-az-internaltoolsproduction-internaltools-production-prod
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                PRIVATE_IP=$(az container show \
                  --resource-group rg-internal-production \
                  --name infoniqadashboard \
                  --query ipAddress.ip -o tsv)

                echo "Container private IP: $PRIVATE_IP"

                RECORD_EXISTS=$(az network dns record-set a show \
                  --subscription 10145897-d207-41e0-826f-b360648982e7 \
                  --resource-group rg-teamzones-production-prod-001 \
                  --zone-name internaltools.production.brz365.net \
                  --name infoniqadashboard \
                  --query name -o tsv 2>/dev/null || echo "")

                if [ -n "$RECORD_EXISTS" ]; then
                  echo "Updating existing DNS record..."

                  OLD_IP=$(az network dns record-set a show \
                    --subscription 10145897-d207-41e0-826f-b360648982e7 \
                    --resource-group rg-teamzones-production-prod-001 \
                    --zone-name internaltools.production.brz365.net \
                    --name infoniqadashboard \
                    --query "aRecords[0].ipv4Address" -o tsv 2>/dev/null || echo "")

                  if [ -n "$OLD_IP" ]; then
                    az network dns record-set a remove-record \
                      --subscription 10145897-d207-41e0-826f-b360648982e7 \
                      --resource-group rg-teamzones-production-prod-001 \
                      --zone-name internaltools.production.brz365.net \
                      --record-set-name infoniqadashboard \
                      --ipv4-address "$OLD_IP" \
                      --yes 2>/dev/null || true
                  fi

                  az network dns record-set a update \
                    --subscription 10145897-d207-41e0-826f-b360648982e7 \
                    --resource-group rg-teamzones-production-prod-001 \
                    --zone-name internaltools.production.brz365.net \
                    --name infoniqadashboard \
                    --set ttl=300
                else
                  echo "Creating new DNS record..."
                  az network dns record-set a create \
                    --subscription 10145897-d207-41e0-826f-b360648982e7 \
                    --resource-group rg-teamzones-production-prod-001 \
                    --zone-name internaltools.production.brz365.net \
                    --name infoniqadashboard \
                    --ttl 300 \
                    --output none
                fi

                az network dns record-set a add-record \
                  --subscription 10145897-d207-41e0-826f-b360648982e7 \
                  --resource-group rg-teamzones-production-prod-001 \
                  --zone-name internaltools.production.brz365.net \
                  --record-set-name infoniqadashboard \
                  --ipv4-address "$PRIVATE_IP"

                echo "DNS record updated: infoniqadashboard.internaltools.production.brz365.net → $PRIVATE_IP"
